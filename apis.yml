aid: axle-energy
name: Axle Energy
description: >-
  Axle Energy operates a virtual power plant (VPP) platform that connects distributed energy
  assets — electric vehicles, EV chargers, home batteries, and heat pumps — to electricity
  flexibility markets through a single unified API. Partners (carmakers, charger and battery OEMs,
  HVAC suppliers, and utilities) register sites and assets, prequalify and enrol them in flex
  propositions, stream telemetry and plug/charge events, and let end users monetise shiftable
  demand. The API covers authentication, meter lookup (MPAN), sites, assets, telemetry/readings,
  rewards/payouts, validation, and half-hourly price curves, with markets live across Great
  Britain, France, Germany, the Netherlands, Denmark and Sweden. React/hosted UI components and a
  documented outbound dispatch webhook round out the developer surface.
